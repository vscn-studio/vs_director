name: Sync About contributors

on:
  schedule:
    - cron: '24 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update contributor list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/contributors?per_page=100" |
            jq -e '[.[][] | .login | select(. != "github-actions[bot]")] | select(length > 0)' > about/contributors.json
          if ! git diff --quiet -- about/contributors.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add about/contributors.json
            git commit -m 'Update About contributor list'
            git push origin HEAD:main
          fi
